
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNYANDWA-MD | PAIRING PRO</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --green: #00ff9c;
  --purple: #bd00ff;
  --cyan: #00eaff;
  --dark: #03060d;
}

body {
  min-height: 100vh;
  background: var(--dark);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow-x: hidden;
}

/* ANIMATED CYBER BACKGROUND */
body::before {
  content: "";
  position: fixed;
  inset: -50%;
  z-index: -2;
  background:
    radial-gradient(circle at 20% 30%,
      #00ff9c55, transparent 30%),
    radial-gradient(circle at 80% 20%,
      #bd00ff66, transparent 30%),
    radial-gradient(circle at 50% 80%,
      #00eaff44, transparent 35%);
  animation: backgroundMove 8s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
  from {
    transform: rotate(0deg) scale(1);
    filter: hue-rotate(0deg);
  }
  to {
    transform: rotate(12deg) scale(1.2);
    filter: hue-rotate(65deg);
  }
}

/* MOVING SCAN LINES */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: repeating-linear-gradient(
    transparent 0px,
    transparent 3px,
    #00ff9c08 4px
  );
}

/* FALLING CYBER PARTICLES */
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

.container {
  width: 100%;
  max-width: 460px;
  position: relative;
  padding: 30px 24px;
  border-radius: 22px;
  background: rgba(4, 9, 18, 0.94);
  border: 1px solid var(--green);
  box-shadow:
    0 0 15px #00ff9c55,
    0 0 45px #00ff9c22,
    inset 0 0 30px #00ff9c08;
  animation: cardGlow 3s infinite alternate;
}

@keyframes cardGlow {
  from {
    box-shadow: 0 0 15px #00ff9c44,
                0 0 30px #bd00ff22;
  }
  to {
    box-shadow: 0 0 30px #00ff9c88,
                0 0 55px #bd00ff55;
  }
}

.logo {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid var(--green);
  border-radius: 50%;
  font-size: 35px;
  color: var(--green);
  text-shadow: 0 0 20px var(--green);
  box-shadow: 0 0 25px #00ff9c77;
  animation: logoPulse 2s infinite;
}

@keyframes logoPulse {
  50% {
    transform: scale(1.06);
    box-shadow: 0 0 45px #00ff9caa;
  }
}

h1 {
  text-align: center;
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--green);
  text-shadow: 0 0 15px #00ff9c99;
}

.subtitle {
  text-align: center;
  color: #bca5ff;
  font-size: 11px;
  letter-spacing: 4px;
  margin-top: 10px;
  margin-bottom: 30px;
}

.line {
  height: 1px;
  margin-bottom: 25px;
  background: linear-gradient(
    90deg, transparent, var(--green),
    var(--purple), transparent
  );
}

label {
  display: block;
  color: var(--green);
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #00ff9c88;
  border-radius: 10px;
  background: #02060c;
  color: white;
  font-size: 18px;
  outline: none;
  transition: .3s;
}

input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 20px #bd00ff55;
}

.hint {
  color: #8896ad;
  font-size: 12px;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(
    100deg, #00d878, #00ffb3
  );
  color: #00180e;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 25px #00ff9c88;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.result {
  margin-top: 25px;
  padding: 20px 12px;
  background: #080d19;
  border: 1px solid #bd00ff88;
  border-radius: 12px;
  text-align: center;
}

.result-title {
  font-size: 12px;
  color: #d78cff;
  letter-spacing: 2px;
}

#pairCode {
  margin: 18px 0;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--green);
  text-shadow: 0 0 15px #00ff9c99;
  overflow-wrap: anywhere;
}

#status {
  font-size: 12px;
  color: #9daec4;
  line-height: 1.7;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #75849a;
  font-size: 11px;
  letter-spacing: 2px;
}

.footer span {
  color: var(--green);
}

@media (max-width: 380px) {
  h1 { font-size: 24px; }
  .container { padding: 25px 17px; }
  #pairCode { font-size: 25px; }
}
</style>
</head>

<body>
<div class="scanlines"></div>
<canvas id="matrix"></canvas>

<main class="container">

  <div class="logo">✦</div>

  <h1>MNYANDWA-MD</h1>
  <div class="subtitle">PAIRING SYSTEM PRO</div>

  <div class="line"></div>

  <label for="phone">WHATSAPP PHONE NUMBER</label>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    value="255672514834"
    placeholder="255XXXXXXXXX"
  >

  <div class="hint">
    Ingiza namba yenye country code.
  </div>

  <button id="generate">
    ⚡ GENERATE PAIRING CODE
  </button>

  <div class="result">
    <div class="result-title">
      YOUR PAIRING CODE
    </div>

    <div id="pairCode">••••-••••</div>

    <div id="status">
      SYSTEM READY — INGIZA NAMBA YAKO
    </div>
  </div>

  <div class="footer">
    POWERED BY <span>MNYANDWA-MD</span>
  </div>

</main>

<script>
// MATRIX BACKGROUND ANIMATION
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let columns = [];
const fontSize = 14;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  columns = Array(
    Math.ceil(canvas.width / fontSize)
  ).fill(0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function drawMatrix() {
  ctx.fillStyle = "rgba(3, 6, 13, 0.12)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = fontSize + "px monospace";

  columns.forEach((y, i) => {
    const chars = "01MNYANDWAMD{}<>/";
    const char = chars[
      Math.floor(Math.random() * chars.length)
    ];

    ctx.fillStyle =
      Math.random() > 0.92 ? "#bd00ff" : "#00ff9c";

    ctx.fillText(
      char,
      i * fontSize,
      y * fontSize
    );

    if (
      y * fontSize > canvas.height &&
      Math.random() > 0.975
    ) {
      columns[i] = 0;
    } else {
      columns[i]++;
    }
  });
}

setInterval(drawMatrix, 60);


// CONNECT TO YOUR PAIRING BACKEND
const button = document.getElementById("generate");
const phoneInput = document.getElementById("phone");
const codeDisplay = document.getElementById("pairCode");
const statusDisplay = document.getElementById("status");

let pollTimer = null;

async function refreshStatus() {
  const response = await fetch("/api/status");
  const data = await response.json();

  statusDisplay.textContent =
    data.error ||
    "STATUS: " + (data.status || "unknown").toUpperCase();

  if (data.code) {
    codeDisplay.textContent = data.code;
  }

  if (data.status === "success") {
    statusDisplay.textContent =
      "WHATSAPP CONNECTED SUCCESSFULLY";
    clearInterval(pollTimer);
    button.disabled = false;
  }

  if (data.status === "error") {
    clearInterval(pollTimer);
    button.disabled = false;
  }

  if (data.status === "idle") {
    codeDisplay.textContent = "••••-••••";
  }
}

button.addEventListener("click", async () => {
  const phone = phoneInput.value.replace(/\D/g, "");

  if (phone.length < 7 || phone.length > 15) {
    statusDisplay.textContent =
      "ERROR: CHECK YOUR PHONE NUMBER";
    return;
  }

  button.disabled = true;
  codeDisplay.textContent = "WAIT...";
  statusDisplay.textContent = "REQUESTING PAIRING CODE...";

  try {
    const response = await fetch("/api/pair/start", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    if (data.code) {
      codeDisplay.textContent = data.code;
    }

    statusDisplay.textContent =
      data.error ||
      "STATUS: " + data.status.toUpperCase();

    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        await refreshStatus();
      } catch (_) {}
    }, 2000);

    if (data.status === "error") {
      clearInterval(pollTimer);
      button.disabled = false;
    }
  } catch (error) {
    statusDisplay.textContent =
      "SERVER ERROR: " + error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
